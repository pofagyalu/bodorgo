# Runs the server's automated tests (server/tests) on Forgejo Actions.
#
# Only when a pull request is opened/updated and when something lands on
# main - not on every push to a work branch - to keep the load on the NAS
# small (see ci/forgejo-runner/README.md). The job fails if a test fails or
# if line coverage drops below the threshold in server/vitest.config.js,
# and the branch protection rule on main then blocks the merge.
name: server-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # The label the runner was registered with (ci/forgejo-runner/README.md).
    runs-on: docker
    container:
      image: node:22-bookworm
    defaults:
      run:
        working-directory: server
    env:
      # Keep mongodb-memory-server's downloaded MongoDB binary (~100MB) in a
      # cached folder instead of fetching it on every run.
      MONGOMS_DOWNLOAD_DIR: /root/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm packages and the MongoDB binary
        uses: actions/cache@v4
        with:
          path: |
            /root/.npm
            /root/.cache/mongodb-binaries
          key: server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: server-

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test (with coverage minimum)
        run: npm run test:coverage
