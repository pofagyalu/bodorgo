<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Buli">
  <!-- The Buli playlist's cover (Média → Zene → Buli): a party gradient, disco
       light rays, confetti, an equalizer and a big BULI. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e93" />
      <stop offset="0.5" stop-color="#8a2be2" />
      <stop offset="1" stop-color="#ff8a00" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1ed760" />
      <stop offset="1" stop-color="#b7ff5a" />
    </linearGradient>
    <radialGradient id="ball" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#d9d9e8" />
      <stop offset="1" stop-color="#7a7a96" />
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" />

  <!-- light rays from the disco ball -->
  <g fill="#fff" opacity="0.12">
    <polygon points="300,150 40,600 150,600" />
    <polygon points="300,150 250,600 350,600" />
    <polygon points="300,150 450,600 560,600" />
    <polygon points="300,150 0,330 0,430" />
    <polygon points="300,150 600,330 600,430" />
  </g>
  <rect width="600" height="600" fill="url(#glow)" />

  <!-- the disco ball -->
  <line x1="300" y1="0" x2="300" y2="92" stroke="#e8e8f5" stroke-width="4" />
  <circle cx="300" cy="150" r="60" fill="url(#ball)" />
  <g stroke="#6b6b85" stroke-width="2" fill="none" opacity="0.55">
    <ellipse cx="300" cy="150" rx="60" ry="22" />
    <ellipse cx="300" cy="150" rx="60" ry="44" />
    <ellipse cx="300" cy="150" rx="22" ry="60" />
    <ellipse cx="300" cy="150" rx="44" ry="60" />
    <line x1="240" y1="150" x2="360" y2="150" />
    <line x1="300" y1="90" x2="300" y2="210" />
  </g>
  <g fill="#fff">
    <circle cx="282" cy="128" r="6" />
    <circle cx="318" cy="170" r="3" />
  </g>

  <!-- confetti -->
  <g>
    <rect x="70" y="70" width="18" height="8" rx="2" fill="#ffe14d" transform="rotate(30 79 74)" />
    <rect x="500" y="90" width="18" height="8" rx="2" fill="#1ed760" transform="rotate(-25 509 94)" />
    <rect x="120" y="230" width="16" height="7" rx="2" fill="#00e5ff" transform="rotate(60 128 233)" />
    <rect x="460" y="240" width="16" height="7" rx="2" fill="#ffe14d" transform="rotate(-50 468 243)" />
    <circle cx="180" cy="60" r="7" fill="#00e5ff" />
    <circle cx="420" cy="50" r="6" fill="#ffe14d" />
    <circle cx="540" cy="190" r="7" fill="#ffffff" />
    <circle cx="50" cy="180" r="6" fill="#1ed760" />
    <circle cx="390" cy="230" r="5" fill="#ffffff" />
    <circle cx="210" cy="250" r="5" fill="#ffe14d" />
  </g>

  <!-- BULI -->
  <text x="300" y="400" text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"
    font-size="170" letter-spacing="6" fill="#000" opacity="0.25">BULI</text>
  <text x="296" y="394" text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"
    font-size="170" letter-spacing="6" fill="#fff">BULI</text>

  <!-- the equalizer -->
  <g fill="url(#bar)">
    <rect x="96" y="500" width="28" height="70" rx="6" />
    <rect x="136" y="460" width="28" height="110" rx="6" />
    <rect x="176" y="480" width="28" height="90" rx="6" />
    <rect x="216" y="440" width="28" height="130" rx="6" />
    <rect x="256" y="470" width="28" height="100" rx="6" />
    <rect x="296" y="430" width="28" height="140" rx="6" />
    <rect x="336" y="465" width="28" height="105" rx="6" />
    <rect x="376" y="445" width="28" height="125" rx="6" />
    <rect x="416" y="485" width="28" height="85" rx="6" />
    <rect x="456" y="505" width="28" height="65" rx="6" />
  </g>
</svg>
