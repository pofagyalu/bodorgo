<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Duruzsoló">
  <!-- The quiet playlist's cover (Média → Zene → Duruzsoló): an evening sky
       going from deep blue to plum, a crescent moon, a few stars, slow sound
       waves and a candle with its glow. No name on it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101830" />
      <stop offset="0.55" stop-color="#2b2850" />
      <stop offset="1" stop-color="#5a3558" />
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="430" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6c56e" stop-opacity="0.75" />
      <stop offset="0.35" stop-color="#f0a85a" stop-opacity="0.28" />
      <stop offset="1" stop-color="#f0a85a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8" />
      <stop offset="1" stop-color="#f6b040" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#sky)" />

  <!-- Stars -->
  <g fill="#f3e9d8">
    <circle cx="92" cy="96" r="3" opacity="0.9" />
    <circle cx="178" cy="58" r="2" opacity="0.7" />
    <circle cx="252" cy="132" r="2.5" opacity="0.8" />
    <circle cx="338" cy="72" r="2" opacity="0.6" />
    <circle cx="64" cy="212" r="2" opacity="0.6" />
    <circle cx="520" cy="236" r="2.5" opacity="0.7" />
    <circle cx="150" cy="170" r="1.5" opacity="0.6" />
    <circle cx="556" cy="70" r="2" opacity="0.7" />
  </g>

  <!-- The crescent moon -->
  <path
    d="M468 86a66 66 0 1 0 40 118a54 54 0 0 1 -40 -118z"
    fill="#f3e2b8"
  />

  <!-- The candle's glow, behind the waves -->
  <rect width="600" height="600" fill="url(#glow)" />

  <!-- Slow sound waves -->
  <g fill="none" stroke-linecap="round">
    <path
      d="M-10 300c60 -34 110 -34 170 0s110 34 170 0s110 -34 170 0s80 26 110 12"
      stroke="#f0b860" stroke-width="5" opacity="0.9"
    />
    <path
      d="M-10 338c60 -24 110 -24 170 0s110 24 170 0s110 -24 170 0s80 18 110 8"
      stroke="#f0b860" stroke-width="3.5" opacity="0.55"
    />
    <path
      d="M-10 370c60 -16 110 -16 170 0s110 16 170 0s110 -16 170 0s80 12 110 6"
      stroke="#f3e9d8" stroke-width="2.5" opacity="0.35"
    />
  </g>

  <!-- The candle -->
  <rect x="270" y="470" width="60" height="130" rx="8" fill="#f3e9d8" />
  <rect x="270" y="470" width="60" height="130" rx="8" fill="#5a3558" opacity="0.18" />
  <path d="M300 470v-16" stroke="#3a2a3a" stroke-width="4" stroke-linecap="round" />
  <path d="M300 392c22 26 28 42 28 54a28 28 0 0 1 -56 0c0 -12 6 -28 28 -54z" fill="url(#flame)" />
  <path d="M300 424c9 11 12 18 12 24a12 12 0 0 1 -24 0c0 -6 3 -13 12 -24z" fill="#fffdf2" />
</svg>
