<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bódorgó</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Private club site: keep it out of search results (see robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/app/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="assets/icons/app/android-chrome-192x192.png"
    />
    <!-- Installable on a phone's home screen (needed for notifications on
         iPhone) - see manifest.webmanifest and sw.js. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/app/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b6548" />
    <!-- The standard name, plus Apple's older one for iPhones that still
         read only that (Chrome warns if only the Apple one is there). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bódorgó" />
    <!-- The landing page's big background picture (the hero's, set by the
         app's stylesheet - tailwind.config.js) is asked for right here, at
         the page's own start, so it downloads beside the app's script
         instead of after it has run. Only on the landing page, and only
         the one this screen uses: the phone's below 1024px, the desktop's
         from there - the same border as Tailwind's "lg". -->
    <script>
      if (location.pathname === '/') {
        var hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.type = 'image/webp';
        hero.fetchPriority = 'high';
        hero.href = matchMedia('(min-width: 1024px)').matches
          ? '/assets/images/bg-header-desktop.webp'
          : '/assets/images/bg-header-mobile.webp';
        document.head.appendChild(hero);
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
