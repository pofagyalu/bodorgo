<!-- Global container -->
<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <!-- Card container -->
  <div
    class="relative flex flex-col m-6 space-y-10 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0 md:m-0 overflow-hidden"
  >
    <!-- Left side -->
    <div class="p-6 md:p-20">
      <!-- Top content -->
      <h2 class="font-rokkitt mb-5 text-4xl font-bold">Belépés</h2>
      @if (mode() === 'local') {
        <p class="max-w-sm mb-12 font-mulish font-light text-gray-600">
          Vészhelyzeti belépés: most csak az alkalmazás gazdája léphet be, a szerveren beállított
          e-mail címmel és jelszóval.
        </p>
        <!-- LOCAL_LOGIN=true on the server: an e-mail and a password kept in
             the app. Otherwise nobody stays on this page (login.component.ts). -->
        <form class="local-login" (ngSubmit)="logInWithPassword()">
          <label>
            E-mail cím
            <input
              type="email"
              name="email"
              autocomplete="username"
              required
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
            />
          </label>
          <label>
            Jelszó
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
            />
          </label>
          <button type="submit" [disabled]="loggingIn() || !email().trim() || !password()">
            {{ loggingIn() ? 'Belépés…' : 'Belépés' }}
          </button>
        </form>
      }
    </div>
    <!-- Right side -->
    <img src="assets/images/login-image.jpg" alt="" class="w-[430px] hidden md:block" />
  </div>
</div>
