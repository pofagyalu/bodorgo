<div class="content">
  <div class="heading">
    <div>
      <div class="kicker">Klub</div>
      <h1>Beállítások</h1>
      <p>A klub egészére vonatkozó beállítások - csak adminoknak.</p>
    </div>
  </div>

  <!-- Pages of cards, so no page is crowded: the club, its money
       (Fizetések), the room the photos take (Tárhely), what the app sends
       by itself (Értesítések), how the Jóléti-index is worked out, and what is only to read (Infó: the list of
       notifications, the versions). -->
  <app-tab-strip
    class="settings-tabs"
    label="Beállítások csoportja"
    [options]="tabs()"
    [value]="activeTab()"
    (valueChange)="selectTab($any($event))"
  />

  <!-- Every page stays in the DOM (only hidden), so a half-filled card
       keeps what was typed into it while another page is looked at.
       Each page's cards in columns (masonry): as many as fit, each card
       whole. -->
  <div role="tabpanel" [hidden]="activeTab() !== 'club'">
    <app-club-settings />
  </div>

  <div role="tabpanel" [hidden]="activeTab() !== 'payments'">
    <app-payment-settings />
  </div>

  <div role="tabpanel" [hidden]="activeTab() !== 'storage'">
    <app-storage-settings />
  </div>

  <div role="tabpanel" [hidden]="activeTab() !== 'app'">
    <app-app-settings />
  </div>

  <!-- Bódorgó jóléti index: how the tours' weather outlook (Életviteli
       tanácsok) is worked out - to read only. -->
  <div role="tabpanel" [hidden]="activeTab() !== 'index'">
    <app-weather-rules />
  </div>

  <div role="tabpanel" [hidden]="activeTab() !== 'info'">
    <app-info-settings />
  </div>

  <!-- OIDC szolgáltató: where everybody logs in (Authentik) - the role
       manager's alone. A wrong value here locks everyone out, hence the
       warning on top and the question before saving. The two secrets are
       never shown: the server doesn't send them. -->
  @if (canManageOidc()) {
    <div class="oidc-page" role="tabpanel" [hidden]="activeTab() !== 'oidc'">
      <app-oidc-settings />
    </div>
  }
</div>
