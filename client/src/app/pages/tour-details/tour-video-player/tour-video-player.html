@if (video(); as video) {
  @if (videos().length > 1) {
    <div class="video-versions" role="tablist" aria-label="Változatok">
      @for (v of videos(); track v.id) {
        <button
          type="button"
          class="version-card"
          role="tab"
          [class.active]="v.id === video.id"
          [attr.aria-selected]="v.id === video.id"
          (click)="select(v)"
        >
          <span class="version-thumb">
            @if (v.hasCover) {
              <img [src]="coverUrl(v)" alt="" loading="lazy" />
            } @else {
              <mat-icon>movie</mat-icon>
            }
          </span>
          <span class="version-name">{{ v.label || 'Videó' }}</span>
        </button>
      }
    </div>
  }

  <!-- One player that stays put - a switch only changes its source (see
     tour-video-player.ts). -->
  <div class="video-wrap" [class.switching]="switching()">
    <video
      #player
      class="tour-video"
      controls
      preload="metadata"
      crossorigin="use-credentials"
      [src]="videoUrl(video)"
      [attr.poster]="video.hasCover ? coverUrl(video) : null"
      (loadeddata)="loaded()"
      (error)="loaded()"
      (play)="started.set(true)"
    >
      @if (video.hasSubtitles) {
        <track kind="subtitles" srclang="hu" label="Magyar" [src]="subtitlesUrl(video)" default />
      }
    </video>
    @if (!started()) {
      <button type="button" class="video-overlay" (click)="player.play()">
        <mat-icon class="video-overlay-icon">play_circle</mat-icon>
        <span class="video-overlay-text">Nyomd meg azt a gombot, te Béla!</span>
      </button>
    }
  </div>
}
