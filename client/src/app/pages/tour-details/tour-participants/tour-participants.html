<section class="participants-section">
  <!-- The whole heading row opens and closes the list - the arrow alone
       is a small target. (The arrow button has no click of its own: its
       click, and Enter on it, arrive here.) -->
  <h2
    class="section-heading participants-heading"
    [title]="showParticipants() ? 'Lista elrejtése' : 'Lista megjelenítése'"
    (click)="toggleParticipants()"
  >
    <button
      type="button"
      class="toggle-btn"
      [attr.aria-expanded]="showParticipants()"
      aria-label="Résztvevők listájának megjelenítése/elrejtése"
    >
      <mat-icon>{{ showParticipants() ? 'expand_less' : 'expand_more' }}</mat-icon>
    </button>
    <!-- Always one line (see .participants-title). -->
    <span class="participants-title"
      >Résztvevők ({{ participantCount() }}/{{ tour().maxCapacity }})</span
    >
    @if (isFull()) {
      <span class="full-badge">Megtelt</span>
    }
    <span class="participants-heading-actions">
      @if (isAdmin()) {
        <a
          [href]="attendeesExcelUrl(tour()._id)"
          class="excel-export-btn"
          (click)="$event.stopPropagation()"
          title="A teljes résztvevő lista Excel fájlba mentése - ki mennyit fizetett, ki mennyivel tartozik még"
        >
          <mat-icon>download</mat-icon>
          <span class="excel-text">Excel</span>
        </a>
      }
    </span>
  </h2>

  @if (showParticipants()) {
    @if (attendees().length) {
      <app-attendee-list
        [tourId]="tour()._id"
        [attendees]="attendees()"
        [totals]="totals()"
        [advancePercent]="tour().advancePaymentPercentage ?? null"
        [currency]="tour().accommodationCurrency ?? 'HUF'"
        [userPhotos]="userPhotos()"
        [paymentMethods]="tour().onSitePayment"
        [locked]="!!tour().closed"
        (nightsUpdated)="nightsUpdated.emit()"
      />
    } @else {
      <p class="empty-note">Még senki nem jelentkezett erre a táborra.</p>
    }
  }
</section>
