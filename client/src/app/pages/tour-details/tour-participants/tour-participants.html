<section class="participants-section">
  <!-- No "Résztvevők" heading (the tab above says it): how many signed up
       and how many places are left, "Megtelt" and an admin's Excel button. -->
  <div class="participants-heading">
    <span class="participants-title"
      >{{ participantCount() }} fő jelentkezett, {{ freePlaces() }} hely szabad</span
    >
    @if (isFull()) {
      <span class="full-badge">Megtelt</span>
    }
    <span class="participants-heading-actions">
      @if (isAdmin()) {
        <a
          [href]="attendeesExcelUrl(tour()._id)"
          class="excel-export-btn"
          title="A teljes résztvevő lista Excel fájlba mentése - ki mennyit fizetett, ki mennyivel tartozik még"
        >
          <mat-icon>download</mat-icon>
          <span class="excel-text">Excel</span>
        </a>
      }
    </span>
  </div>

  @if (attendees().length) {
    <app-attendee-list
      [tourId]="tour()._id"
      [attendees]="attendees()"
      [totals]="totals()"
      [advancePercent]="tour().advancePaymentPercentage ?? null"
      [currency]="tour().accommodationCurrency ?? 'HUF'"
      [userPhotos]="userPhotos()"
      [paymentMethods]="tour().onSitePayment"
      [locked]="!!tour().closed"
      (nightsUpdated)="nightsUpdated.emit()"
    />
  } @else {
    <p class="empty-note">Még senki nem jelentkezett erre a táborra.</p>
  }
</section>
