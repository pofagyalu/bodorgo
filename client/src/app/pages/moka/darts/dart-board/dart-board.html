<svg class="board" viewBox="-225 -225 450 450" role="img" aria-label="Darts tábla">
  <circle class="rim" r="222" />
  @for (s of sectors; track s.value) {
    <g class="sector" [class.even]="s.even" [style.animation-delay]="s.delay">
      <path class="single" [attr.d]="s.innerSingle" />
      <path class="ring" [attr.d]="s.triple" />
      <path class="single" [attr.d]="s.outerSingle" />
      <path class="ring" [attr.d]="s.double" />
      <text class="number" [attr.x]="s.x" [attr.y]="s.y">{{ s.value }}</text>
    </g>
  }
  <circle class="outer-bull" [attr.r]="r.outerBull" />
  <circle class="bull" [attr.r]="r.bull" />
</svg>
