<div class="media-shell">
  <aside class="media-sidebar" aria-label="Média navigáció">
    <div class="media-brand">
      <div class="brand-mark"><mat-icon>play_circle</mat-icon></div>
      <div class="brand-text"><strong>Bódorgó Média</strong><small>Csak tagoknak</small></div>
    </div>

    <nav class="media-nav" aria-label="Média főmenü">
      <a
        routerLink="videok"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        title="Videók"
      >
        <mat-icon>movie</mat-icon><span>Videók</span>
      </a>
      <div class="sub-nav">
        @for (c of media.categories(); track c.key) {
          <a
            [routerLink]="['videok', c.key]"
            routerLinkActive="active"
            class="sub-item"
            [title]="c.title"
          >
            <mat-icon [style.color]="categoryColor(c.key)">{{ categoryIcon(c.key) }}</mat-icon>
            <span class="sub-title">{{ c.title }}</span>
            <span class="sub-count">{{ c.videos.length }}</span>
          </a>
        }
      </div>

      <a routerLink="fotok" routerLinkActive="active" class="nav-item" title="Fotók (hamarosan)">
        <mat-icon>photo_library</mat-icon><span>Fotók</span>
        <span class="soon">hamarosan</span>
      </a>
    </nav>

    <div class="side-bottom">
      <strong>Közös emlékek</strong>
      Szilveszterek, farsangok és minden, ami nem fért bele egy táborba.
    </div>
  </aside>

  <main class="media-main">
    <nav class="media-mobile-nav" aria-label="Média főmenü mobilon">
      <a routerLink="videok" routerLinkActive="active">Videók</a>
      <a routerLink="fotok" routerLinkActive="active">Fotók</a>
    </nav>

    <router-outlet />
  </main>
</div>
