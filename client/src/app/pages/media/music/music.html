<div class="content">
  <!-- Phone (no Média sidebar): the playlists to switch between. -->
  <nav class="list-chips" aria-label="Lejátszási listák">
    <a class="chip" routerLink="/media/zene/bodorgo-fm" routerLinkActive="active">
      <mat-icon>radio</mat-icon>Bódorgó FM
    </a>
    <a class="chip" routerLink="/media/zene/buli" routerLinkActive="active">
      <mat-icon>celebration</mat-icon>Buli rádió
    </a>
    <a class="chip" routerLink="/media/zene/hatter" routerLinkActive="active">
      <mat-icon>nightlight</mat-icon>Duruzsoló
    </a>
  </nav>

  <!-- One paper card: the station on top, a line, the playlist under it. -->
  <div class="radio-card">
    <!-- The station: the radio, what's on, the FM band and the knobs
         (fm-radio). -->
    <app-fm-radio />

    @if (isAdmin()) {
      <!-- Admins: reload the list from Jellyfin now - in the top right
           corner. -->
      <button
        type="button"
        class="refresh"
        title="Lista frissítése"
        [disabled]="refreshing()"
        (click)="refresh()"
      >
        <mat-icon [class.spin]="refreshing()">refresh</mat-icon>
      </button>
    }

    <!-- The whole playlist - tap a song to play it -->
    <section class="playlist">
      <div class="playlist-head">
        <h2>Műsor</h2>
        <span class="count">{{ tracks().length }} dal</span>
      </div>
      <app-track-list
        look="radio"
        [tracks]="tracks()"
        [currentIndex]="currentIndex()"
        [playing]="playing()"
        (picked)="pick($event)"
      />
    </section>
  </div>
</div>
