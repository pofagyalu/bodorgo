<div class="frame">
  <!-- Buli: a track table, with its head row. -->
  @if (look() === 'party') {
    <div class="table-head">
      <span class="col-num">#</span>
      <span>Cím</span>
      <mat-icon class="col-len">schedule</mat-icon>
    </div>
  }
  <ol class="tracks" #list>
    @for (t of tracks(); track t.id; let i = $index) {
      <li [attr.data-index]="i">
        <button
          type="button"
          class="track"
          [class.track--current]="i === currentIndex()"
          (click)="picked.emit(i)"
        >
          <span class="col-num">
            @if (i === currentIndex() && playing()) {
              <!-- The one playing: bouncing bars - Duruzsoló: a small flame. -->
              @if (look() === 'lounge') {
                <span class="flame" aria-hidden="true"></span>
              } @else {
                <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
              }
            } @else {
              <span class="num">{{ i + 1 }}</span>
              <mat-icon class="num-play">play_arrow</mat-icon>
            }
          </span>
          <span class="song">
            @if (music.imageSrc(t); as src) {
              <img class="thumb" [src]="src" [appHoverPreview]="src" alt="" loading="lazy" />
            } @else {
              <span class="thumb thumb--none"><mat-icon>music_note</mat-icon></span>
            }
            <span class="song-text">
              <strong>{{ t.title }}</strong>
              <span>{{ t.artist }}</span>
            </span>
          </span>
          <span class="col-len">{{ t.durationMs ? time(t.durationMs / 1000) : '' }}</span>
        </button>
      </li>
    } @empty {
      <li class="empty-note">
        {{ music.loading() ? 'Betöltés...' : (music.error() ?? 'Üres a lista.') }}
      </li>
    }
  </ol>
</div>
