<div
  #scroller
  class="scroller"
  [class.scroller--fit]="fit()"
  role="tablist"
  [attr.aria-label]="label()"
  [class.more-before]="moreBefore()"
  [class.more-after]="moreAfter()"
  (scroll)="measure()"
>
  @for (o of options(); track o.value) {
    <button
      role="tab"
      type="button"
      [attr.aria-selected]="o.value === value()"
      [class.active]="o.value === value()"
      (click)="value.set(o.value)"
    >
      {{ o.label }}
      @if (o.count !== undefined) {
        <span class="count">{{ o.count }}</span>
      }
    </button>
  }
  <!-- The open tab's underline: one line for the whole row, so it can
       slide from tab to tab. -->
  <span #ink class="ink" aria-hidden="true"></span>
</div>
