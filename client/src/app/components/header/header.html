<header class="header-container">
  <!-- Left: hamburger (mobile only) + logo, always visible -->
  <div class="left-group">
    <button
      class="hamburger"
      type="button"
      aria-label="Menü megnyitása"
      (click)="isMobileMenuOpen = true"
    >
      ☰
    </button>

    <div class="logo-container">
      <a routerLink="/">
        <img
          src="assets/images/transparent_color_logo.svg"
          alt="Logo"
          class="logo"
        />
      </a>
    </div>
  </div>

  <!-- Middle: Menu (desktop only, hidden on mobile in favor of the hamburger) -->
  @if (auth.isLoggedIn()) {
  <nav class="menu">
    <a routerLink="/taborok" routerLinkActive="active" class="menu-item red">Táborok</a>
    <a routerLink="/chat" routerLinkActive="active" class="menu-item blue">Chat</a>
    <!-- Hidden for now, still routable - not ready for public linking yet -->
    <!-- <a routerLink="/szavazasok" routerLinkActive="active" class="menu-item green">Szavazások</a> -->
    <!-- <a routerLink="/versenyek" routerLinkActive="active" class="menu-item orange">Versenyek</a> -->
  </nav>

  }

  <!-- Right side: Login or Logout (desktop only) -->
  <div class="login-container">
    @if (!auth.isLoggedIn()) {
    <button class="login-btn" (click)="login()">Gyere bé!</button>
    } @else {
    <span class="user-name">Szevasz {{ auth.user()?.name }}!</span>
    <button class="login-btn logout" (click)="logout()">Kijelentkezés</button>
    }
  </div>
</header>

<!-- Tapping outside the slide-in panel closes it, like any other app -->
<div
  class="mobile-backdrop"
  [class.open]="isMobileMenuOpen"
  (click)="closeMobileMenu()"
></div>

<!-- Mobile Slide-in Menu -->
<div class="mobile-menu" [class.open]="isMobileMenuOpen">
  <!-- Close button -->
  <button class="close-btn" aria-label="Menü bezárása" (click)="closeMobileMenu()">✖</button>

  @if (auth.isLoggedIn()) {
  <nav class="mobile-nav">
    <a
      routerLink="/taborok"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
      class="menu-item red"
      >Táborok</a
    >
    <a
      routerLink="/chat"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
      class="menu-item blue"
      >Chat</a
    >
    <!-- Hidden for now, still routable - not ready for public linking yet -->
    <!-- <a
      routerLink="/szavazasok"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
      class="menu-item green"
      >Szavazások</a
    > -->
    <!-- <a
      routerLink="/versenyek"
      routerLinkActive="active"
      (click)="closeMobileMenu()"
      class="menu-item orange"
      >Versenyek</a
    > -->
    <button class="menu-item logout-item" (click)="logout(); closeMobileMenu()">
      Kijelentkezés
    </button>
  </nav>
  } @else {
  <button class="login-btn" (click)="login(); closeMobileMenu()">Gyere bé!</button>
  }
</div>
