<!-- The arrows are the horizontal band's; a vertical wheel has none. -->
@if (!vertical()) {
  <button
    class="arrow"
    type="button"
    aria-label="Előző"
    [disabled]="centered() === 0"
    (click)="step(-1)"
  >
    ‹
  </button>
}

<div
  #band
  class="band"
  [class.dragging]="dragging()"
  role="group"
  tabindex="0"
  [attr.aria-label]="label()"
  (scroll)="onScroll()"
  (keydown)="onKeydown($event)"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
>
  @for (option of items(); track $index; let i = $index) {
    <button
      class="item"
      type="button"
      tabindex="-1"
      [class.centered]="i === centered()"
      [attr.aria-current]="i === centered() ? 'true' : null"
      (click)="pick(i)"
    >
      {{ option.label }}
    </button>
  }
</div>

@if (!vertical()) {
  <button
    class="arrow"
    type="button"
    aria-label="Következő"
    [disabled]="centered() === items().length - 1"
    (click)="step(1)"
  >
    ›
  </button>
}
