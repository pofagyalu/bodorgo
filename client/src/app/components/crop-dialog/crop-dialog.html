<div class="crop-backdrop" (click)="cancel()"></div>
<div class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="cropDialogTitle">
  <h2 id="cropDialogTitle">{{ title() }}</h2>
  <p class="crop-hint">Húzd a képet vagy a keretet a helyére, és nagyíts a csúszkával.</p>

  <div class="crop-area">
    <image-cropper
      [imageFile]="file()"
      [maintainAspectRatio]="true"
      [aspectRatio]="aspectRatio()"
      [resizeToWidth]="outputWidth()"
      [onlyScaleDown]="true"
      format="jpeg"
      [imageQuality]="85"
      output="blob"
      [autoCrop]="false"
      [allowMoveImage]="true"
      [transform]="transform()"
      (transformChange)="transform.set($event)"
      (cropperReady)="ready.set(true)"
      (loadImageFailed)="failed.emit()"
    ></image-cropper>
  </div>

  <label class="crop-zoom">
    <span>Nagyítás</span>
    <input
      type="range"
      min="1"
      max="4"
      step="0.01"
      [value]="transform().scale ?? 1"
      [disabled]="!ready()"
      (input)="setZoom($any($event.target).value)"
    />
  </label>

  <div class="crop-actions">
    <button type="button" class="crop-btn" [disabled]="busy() || cropping()" (click)="cancel()">Mégse</button>
    <button
      type="button"
      class="crop-btn crop-btn--primary"
      [disabled]="!ready() || busy() || cropping()"
      (click)="confirm()"
    >
      {{ busy() || cropping() ? 'Mentés…' : 'Mentés' }}
    </button>
  </div>
</div>
