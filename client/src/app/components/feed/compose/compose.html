<form class="compose-container" [class.typing]="typing()" (ngSubmit)="submit()">
  <!-- "@" suggestions: the tour's attendees with a username. -->
  @if (suggestions().length) {
    <ul class="mention-list" role="listbox" aria-label="Megemlíthető résztvevők">
      @for (m of suggestions(); track m.username; let i = $index) {
        <li
          role="option"
          [class.active]="i === highlighted()"
          [attr.aria-selected]="i === highlighted()"
          (mousedown)="$event.preventDefault(); pick(m)"
          (mouseenter)="highlighted.set(i)"
        >
          <strong>&#64;{{ m.username }}</strong>
          <span>{{ m.name }}</span>
        </li>
      }
    </ul>
  }

  <!-- The photo about to be sent (📷 below), with ✕ to drop it. -->
  @if (photo(); as p) {
    <div class="photo-preview">
      <img [src]="p.url" alt="A küldendő fotó" />
      <button
        type="button"
        class="photo-remove"
        aria-label="Fotó eltávolítása"
        (click)="removePhoto()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  } @else if (photoError()) {
    <div class="photo-preview photo-preview--error">{{ photoError() }}</div>
  }

  <!-- Attach a photo (shrunk on the phone before sending). -->
  <label class="photo-btn" title="Fotó küldése" aria-label="Fotó küldése">
    <mat-icon>photo_camera</mat-icon>
    <input type="file" accept="image/*" hidden (change)="pickPhoto($event)" />
  </label>

  <!-- Start a poll in this chat (see poll-create). -->
  <button
    type="button"
    class="poll-btn"
    title="Szavazás indítása"
    aria-label="Szavazás indítása"
    (click)="pollRequested.emit()"
  >
    <mat-icon>poll</mat-icon>
  </button>

  <textarea
    #messageInput
    placeholder="Üzenet"
    rows="1"
    [ngModel]="text()"
    (ngModelChange)="onTextChange($event)"
    (keydown)="onKeydown($event)"
    (click)="updateMentionQuery()"
    (focus)="typing.set(true)"
    (blur)="typing.set(false); updateMentionQuery()"
    name="message"
  ></textarea>

  <button type="submit" aria-label="Küldés" [disabled]="sending()">
    <mat-icon>{{ sending() ? 'hourglass_top' : 'send' }}</mat-icon>
  </button>
</form>
