<div class="feed-wrapper">
  <div class="feed-container" #feedContainer>
    @for (post of posts(); track post._id) {
    <app-post
      [creatorInput]="post.creator.name"
      [textInput]="post.text"
      [timestampInput]="post.createdAt"
      [imageUrlInput]="post.image"
      [isOwn]="post.creator._id === currentUserId()"
    />
    }
  </div>

  <app-compose (send)="onCompose($event)"></app-compose>
</div>
