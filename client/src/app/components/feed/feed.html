<div class="feed-wrapper">
  <div
    class="feed-container"
    #feedContainer
    [class.feed-container--photo]="!!backgroundImage()"
    [style.background-image]="backgroundImage()"
  >
    @for (post of posts(); track post._id) {
      @if (dayBreaks().get(post._id); as day) {
        <div class="day-break">{{ day }}</div>
      }
      <!-- Where I left off: what's under this line came since. -->
      @if (post._id === firstUnreadId()) {
        <div class="unread-break" #unreadBreak><span>Új üzenetek</span></div>
      }
      <app-post
        [creatorInput]="post.creator.username || post.creator.name"
        [textInput]="post.text"
        [timestampInput]="post.createdAt"
        [image]="post.image ?? null"
        [imageThumbUrl]="post.image ? chatThumb(post._id) : null"
        [imageFullUrl]="post.image ? chatFull(post._id) : null"
        [isOwn]="post.creator._id === currentUserId()"
        [edited]="!!post.editedAt"
        [deleted]="!!post.deletedAt"
        [pollId]="post.poll ?? null"
        [knownUsernamesInput]="knownUsernames()"
        [myUsernameInput]="myUsername()"
        [reactionsInput]="post.reactions"
        [currentUserIdInput]="currentUserId()"
        (reacted)="onReact(post._id, $event)"
        (editSaved)="onEdit(post._id, $event)"
        (deleteConfirmed)="onDelete(post._id)"
      />
    }
  </div>

  <!-- A past tour's chat is an archive: read, not written. -->
  @if (readOnly()) {
    <p class="closed-note">Ez a Kotyogó lezárult – már csak olvasható.</p>
  } @else {
    <app-compose
      [mentionables]="mentionables()"
      [sending]="sendingPhoto()"
      (send)="onCompose($event)"
      (pollRequested)="creatingPoll.set(true)"
    ></app-compose>
  }

  @if (creatingPoll()) {
    <app-poll-create [tourId]="tourId()" (closed)="creatingPoll.set(false)" />
  }
</div>
