<app-header></app-header>

<!-- No connection: what is on the screen is what the device last got. -->
@if (isOffline()) {
  <div class="offline-line" role="status">
    Nincs internetkapcsolat – a legutóbb letöltött adatokat látod.
  </div>
}

<!-- The page scrolls here, below the header - not the whole window - so
     its scrollbar starts under the main menu too. -->
<main class="page-body">
  <div [@routeAnimations]="getRouteAnimationData()">
    <router-outlet></router-outlet>
  </div>
</main>

<app-notification-list></app-notification-list>
<app-confirm-dialog />
<!-- Confetti and a greeting on your birthday (Beállítások → Születésnap). -->
<app-birthday-celebration />
