<div class="player-backdrop" (click)="close()">
  <div
    class="player"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <div class="player-head">
      <div class="player-titles">
        <strong>{{ title() }}</strong>
        @if (subtitle()) {
          <span>{{ subtitle() }}</span>
        }
      </div>
      <!-- A wink at a video made with AI, in the middle of the line (a
           phone: a line of its own; full screen has no header, so no wink). -->
      @if (aiGenerated()) {
        <span class="ai-line">{{ aiLine }}</span>
      }
      <!-- Only a video with a small copy has the two to pick from. -->
      @if (smallSrc()) {
        <div class="player-quality" role="group" aria-label="Képminőség">
          <button
            type="button"
            [class.active]="quality() === 'small'"
            [attr.aria-pressed]="quality() === 'small'"
            title="Tömörített változat – gyenge kapcsolaton is megy"
            (click)="setQuality('small')"
          >
            Tömörített
          </button>
          <button
            type="button"
            [class.active]="quality() === 'original'"
            [attr.aria-pressed]="quality() === 'original'"
            title="Az eredeti videó – jó kapcsolat kell hozzá"
            (click)="setQuality('original')"
          >
            Eredeti
          </button>
        </div>
      }
      <!-- The resolution of the one playing. -->
      @if (resolution(); as res) {
        <span class="player-resolution" title="Felbontás">{{ res }}</span>
      }
      <button type="button" class="player-close" (click)="close()" title="Bezárás">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <!-- The video and what lies over it (the browser's own full screen
         shows the bare video only, without the AI mark). -->
    <div class="player-stage">
      <!-- Keyed by the source, so another video (or quality) starts fresh. -->
      <video
        *appRecreateOn="playingSrc(); let key"
        #video
        class="player-video"
        controls
        autoplay
        preload="metadata"
        crossorigin="use-credentials"
        (loadstart)="applyVolume(video)"
        (volumechange)="onVolumeChange(video)"
        (loadedmetadata)="onLoaded(video)"
        (timeupdate)="onTimeUpdate(video)"
      >
        <source [src]="key" type="video/mp4" />
        @if (subtitlesSrc(); as subs) {
          <!-- default: shown right away, not only when picked in the player's menu. -->
          <track kind="subtitles" srclang="hu" label="Magyar" [src]="subs" default />
        }
      </video>
      <!-- Made with AI: over the picture, top left. -->
      @if (aiGenerated()) {
        <span class="ai-badge" title="AI-val készült videó"
          ><mat-icon aria-hidden="true">auto_awesome</mat-icon>AI</span
        >
      }
    </div>
  </div>
</div>
