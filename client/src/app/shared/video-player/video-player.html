<div class="player-backdrop" (click)="close()">
  <div
    class="player"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <div class="player-head">
      <div class="player-titles">
        <strong>{{ title() }}</strong>
        @if (subtitle()) {
          <span>{{ subtitle() }}</span>
        }
      </div>
      <!-- Only a video with a small copy has the two to pick from. -->
      @if (smallSrc()) {
        <div class="player-quality" role="group" aria-label="Képminőség">
          <button
            type="button"
            [class.active]="quality() === 'small'"
            [attr.aria-pressed]="quality() === 'small'"
            title="Kisebb felbontás – gyenge kapcsolaton is megy"
            (click)="setQuality('small')"
          >
            Kis
          </button>
          <button
            type="button"
            [class.active]="quality() === 'original'"
            [attr.aria-pressed]="quality() === 'original'"
            title="Az eredeti videó – jó kapcsolat kell hozzá"
            (click)="setQuality('original')"
          >
            Eredeti
          </button>
        </div>
      }
      <button type="button" class="player-close" (click)="close()" title="Bezárás">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <!-- Keyed by the source, so another video (or quality) starts fresh. -->
    @for (key of [playingSrc()]; track key) {
      <video
        #video
        class="player-video"
        controls
        autoplay
        preload="metadata"
        crossorigin="use-credentials"
        (loadedmetadata)="onLoaded(video)"
      >
        <source [src]="key" type="video/mp4" />
        @if (subtitlesSrc(); as subs) {
          <!-- default: shown right away, not only when picked in the player's menu. -->
          <track kind="subtitles" srclang="hu" label="Magyar" [src]="subs" default />
        }
      </video>
    }
  </div>
</div>
