@if (title()) {
  <p class="title">{{ title() }}</p>
}

<div class="steps" role="list" aria-label="Dobogó">
  @for (step of steps(); track step.place) {
    <div
      class="step"
      role="listitem"
      [class.step--first]="step.place === 1"
      [class.step--second]="step.place === 2"
      [class.step--third]="step.place === 3"
      [class.step--arrived]="arrived() === step.place"
    >
      <!-- Who stands on it - or nobody yet. -->
      <div class="standing">
        @if (step.winner; as w) {
          <app-avatar
            class="face"
            [name]="w.name"
            [userId]="w.userId"
            [photoVersion]="w.photoVersion"
            [preview]="false"
          />
          <span class="name">{{ w.name }}</span>
        } @else {
          <span class="face face--empty" aria-hidden="true">{{ emptyText() }}</span>
          <span class="name name--empty">még szabad</span>
        }
      </div>
      <!-- The step itself, with its number. -->
      <div class="block">
        <span class="number">{{ step.place }}</span>
      </div>
    </div>
  }
</div>
